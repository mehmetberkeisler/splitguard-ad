# The three verification gates, on every push and pull request.
#
# No dependency installation step: the gates and the whole test suite import
# nothing outside the standard library, by design. Everything that needs torch
# or sklearn is a training script, and training is not reproducible in CI, so
# what CI can check it checks completely rather than partially.
#
# scripts/check_environment.py is deliberately absent. It compares the running
# interpreter against the environment the published numbers came from, which a
# runner does not have and is not meant to have. It belongs on a machine that
# is about to retrain an arm or regenerate a figure, and scripts/
# rebuild_after_gpu.sh runs it there as a preflight.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Every number against its artefact
        run: python3 scripts/verify_paper_numbers.py

      - name: Submission requirements
        run: python3 scripts/validate_submission.py
