# Two jobs, because they answer two different questions.
#
# `gates` proves the verification layer works: tests, every manuscript number
# against its artefact, and the submission requirements. It installs nothing,
# because the gates and the whole test suite import only the standard library.
# That is a property worth keeping, so this job would fail if it were lost.
#
# `scientific-stack` proves the training runtime actually imports under the
# pinned environment. Without it, CI can be green on a machine where every
# training script dies at its first metric call, which is the failure this
# project hit: an installed scikit-learn older than the pin against a newer
# numpy leaves sklearn.metrics unimportable, and no gate above imports it.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: gates (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # poppler-utils supplies pdftotext. The number verifier reads the
      # graphical abstract with it, because that PDF is hand-made, ships with
      # the submission, and nothing regenerates it when a number moves: it
      # carried five superseded values for two months. The check is worth an
      # apt line, and the verifier reports the artefact as unverified rather
      # than passing quietly if the binary is missing.
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install the package itself (core has no dependencies)
        run: pip install -e .

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Every number against its artefact
        run: python scripts/verify_paper_numbers.py

      - name: Submission requirements
        run: python scripts/validate_submission.py

      - name: The core really does run on a bare interpreter
        run: |
          python - <<'PY'
          # Measure what importing the package ADDS. An absolute scan would
          # also catch namespace packages the interpreter injects at startup
          # (anaconda contributes google, sphinxcontrib, zope), which the
          # package never imports, and the check would fail for a bogus reason.
          import sys
          sys.path.insert(0, "src")
          before = set(sys.modules)
          import splitguard_ad  # noqa: F401
          added = {m.split(".")[0] for m in set(sys.modules) - before}
          third_party = sorted(m for m in added
                               if m != "splitguard_ad"
                               and not m.startswith("_")
                               and m not in sys.stdlib_module_names)
          assert not third_party, f"importing the core pulled in {third_party}"
          print("splitguard_ad imports with no third-party dependency")
          PY

  scientific-stack:
    name: scientific stack (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lock-${{ hashFiles('requirements-lock.txt') }}

      - name: Install the exact environment the published numbers came from
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch==2.8.0 torchvision==0.23.0
          # monai 1.5.0 declares torch<2.7.0 while the node ran it against
          # torch 2.8.0, because gpu_setup.sh installs it with --no-deps onto
          # the image's CUDA torch. Installing the lock file as a whole cannot
          # resolve; reproducing the node means reproducing that step.
          grep -v '^monai==' requirements-lock.txt > /tmp/lock-no-monai.txt
          pip install -r /tmp/lock-no-monai.txt
          pip install --no-deps monai==1.5.0
          pip install -e .

      - name: Check the environment matches the pins
        run: python scripts/check_environment.py

      - name: Import smoke test
        run: |
          python - <<'PY'
          import torch, torchvision, sklearn, scipy, monai, nibabel, matplotlib
          # sklearn.metrics is the one that breaks under a numpy ABI mismatch,
          # and importing the package alone does not touch it.
          from sklearn.metrics import roc_auc_score
          print("scientific stack imports successfully")
          PY

      - name: Training entry points reach their argument parsers
        run: |
          for s in train_adni_baseline run_adni_inflation_gap run_biometric_probe_adni train_adni_3d; do
            python "scripts/$s.py" --help > /dev/null || exit 1
          done
          echo "training entry points import and parse"

      - name: Synthetic end-to-end pipeline, no cohort data required
        run: python -m unittest tests.test_end_to_end_synthetic -v
